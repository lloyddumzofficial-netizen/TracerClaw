  <g font-family="Manrope, Arial, sans-serif">
    <text x="92" y="126" fill="#F4F4F1" font-size="25" font-weight="800" letter-spacing="5">DESAYNCLAW</text>
    <circle cx="968" cy="116" r="7" fill="#E9C646"/>
    <text x="92" y="186" fill="#929591" font-size="17" font-weight="700" letter-spacing="3">SERVICE NOTICE</text>
