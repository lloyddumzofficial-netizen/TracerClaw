  </defs>

  <rect width="1080" height="1080" fill="#08090A"/>
  <rect x="32" y="32" width="1016" height="1016" rx="28" fill="url(#surface)" stroke="#F4F4F1" stroke-opacity=".16" stroke-width="2"/>
