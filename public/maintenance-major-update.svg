    <text x="92" y="420" fill="#F4F4F1" font-size="106" font-weight="800" letter-spacing="-4">Major</text>
    <text x="92" y="526" fill="#F4F4F1" font-size="106" font-weight="800" letter-spacing="-4">update.</text>

